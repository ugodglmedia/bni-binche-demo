<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Accès privé</title>
<style>
:root{--red:#cf2030;--ink:#141414;--muted:#63666a;--line:#d6d6d6;--bg:#f3f3f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
form{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
h1{margin:0;font-size:22px}p{margin:0;color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:inherit;font-weight:700;padding:11px;border-radius:8px;border:none;background:var(--red);color:#fff;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.err{color:#c24141;font-weight:600;min-height:1em;font-size:14px}
</style></head><body>
<form id="f" autocomplete="off"><h1>Accès privé</h1><p>Démonstration réservée. Entrez le mot de passe qui vous a été transmis.</p>
<label>Mot de passe<input type="password" id="pw" autocomplete="current-password" autofocus></label>
<p class="err" id="err" role="alert"></p><button id="go" type="submit">Entrer</button></form>
<script>
const SALT = Uint8Array.from(atob("rhZQz0LJKK312hy6X22riw=="), c => c.charCodeAt(0)), ITER = 310000;
async function open(rawB64){
  const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(rawB64), c => c.charCodeAt(0)), "AES-GCM", false, ["decrypt"]);
  const b = new Uint8Array(await (await fetch("app.enc", { cache: "no-store" })).arrayBuffer());
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12)));
  try { sessionStorage.setItem("bni-binche-key", rawB64); } catch {}
  document.open(); document.write(html); document.close();
}
(async () => { let k = null; try { k = sessionStorage.getItem("bni-binche-key"); } catch {} if (k) { try { await open(k); } catch { try { sessionStorage.removeItem("bni-binche-key"); } catch {} } } })();
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const go = document.getElementById("go"), err = document.getElementById("err"); go.disabled = true; go.textContent = "Ouverture…"; err.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value.trim()), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    await open(raw);
  } catch { err.textContent = "Mot de passe incorrect."; go.disabled = false; go.textContent = "Entrer"; }
};
</script></body></html>
